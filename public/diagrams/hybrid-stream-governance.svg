<text x="370" y="188" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="600">Confluent Platform</text>
<text x="334" y="222" font-size="9.5" fill="#9da7b3" text-anchor="start">Kafka + Connect + Schema Registry</text>
<text x="334" y="238" font-size="9.5" fill="#9da7b3" text-anchor="start">(self-managed)</text>

<rect x="60" y="355" width="500" height="90" rx="12" fill="#161b22" stroke="#388bfd" stroke-width="2"/>
<text x="310" y="392" font-size="12.5" fill="#e6edf3" text-anchor="middle" font-weight="600">USM Agent</text>
<text x="310" y="410" font-size="9.5" fill="#9da7b3" text-anchor="middle">outbound-only metadata/telemetry — reads only, never receives commands</text>

<rect x="830" y="90" width="350" height="400" rx="16" fill="none" stroke="#388bfd" stroke-width="2"/>
<text x="846" y="114" font-size="12" fill="#388bfd" text-anchor="start" font-weight="600">Confluent Cloud (control plane)</text>

<rect x="860" y="160" width="290" height="90" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
<text x="1005" y="196" font-size="12" fill="#e6edf3" text-anchor="middle" font-weight="600">Schema Registry</text>
<text x="1005" y="214" font-size="9.5" fill="#9da7b3" text-anchor="middle">registry of record for the hybrid estate</text>

<rect x="860" y="355" width="290" height="90" rx="12" fill="#161b22" stroke="#57606a" stroke-width="2"/>
<text x="1005" y="391" font-size="12" fill="#e6edf3" text-anchor="middle" font-weight="600">Stream Catalog</text>
<text x="1005" y="409" font-size="9.5" fill="#9da7b3" text-anchor="middle">governance control plane</text>

<path d="M260,205 L320,205" fill="none" stroke="#9da7b3" stroke-width="2" marker-end="url(#arrow)"/>
<text x="290" y="195" font-size="9" fill="#9da7b3" text-anchor="middle">CDC</text>

<path d="M560,205 L860,205" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowg)"/>
<text x="710" y="193" font-size="9.5" fill="#9da7b3" text-anchor="middle">schema FORWARD — synchronous proxy</text>
<text x="710" y="222" font-size="9" fill="#9da7b3" text-anchor="middle">(fails loudly if you skip the mode flip)</text>

<path d="M560,400 L860,400" fill="none" stroke="#388bfd" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowb)"/>
<text x="710" y="388" font-size="9.5" fill="#9da7b3" text-anchor="middle">metadata sync — async telemetry</text>
<text x="710" y="417" font-size="9" fill="#9da7b3" text-anchor="middle">(can lag or miss silently)</text>

<rect x="40" y="530" width="1140" height="90" rx="10" fill="#161b22" stroke="#57606a" stroke-width="1.4"/>
<text x="60" y="554" font-size="10.5" fill="#e6edf3" font-weight="600">"Unified governance" is two different mechanisms wearing one UI.</text>
<text x="60" y="572" font-size="10" fill="#9da7b3">Schema forwarding is a real-time write proxy — verified: a Debezium CDC connector's auto-created schemas appeared in Confluent</text>
<text x="60" y="588" font-size="10" fill="#9da7b3">Cloud's real Schema Registry with no manual step, once FORWARD mode was explicitly enabled. Metadata/topic sync is a separate,</text>
<text x="60" y="604" font-size="10" fill="#9da7b3">one-way telemetry channel from the USM Agent — its topic-level catalog visibility wasn't independently verifiable in this session.</text>
</svg>
