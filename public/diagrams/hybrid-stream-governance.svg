</defs>
<text x="610" y="30" font-size="19" fill="#e6edf3" text-anchor="middle" font-weight="600">Hybrid Governance for a Self-Managed Kafka Cluster with USM</text>
<text x="610" y="52" font-size="12.5" fill="#9da7b3" text-anchor="middle">Two different sync mechanisms, one console — proven over real ingress PrivateLink</text>

<rect x="30" y="90" width="560" height="400" rx="16" fill="none" stroke="#ff9900" stroke-width="2" stroke-dasharray="7 5"/>
<text x="46" y="114" font-size="12" fill="#ff9900" text-anchor="start" font-weight="600">Self-managed cluster (Azure VM — stands in for on-prem)</text>

<rect x="60" y="165" width="200" height="80" rx="12" fill="#161b22" stroke="#9da7b3" stroke-width="2"/>
<text x="160" y="198" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-weight="600">SQL Server</text>
<text x="160" y="216" font-size="9.5" fill="#9da7b3" text-anchor="middle">(CDC source)</text>

<rect x="320" y="155" width="240" height="100" rx="12" fill="#161b22" stroke="#ffb454" stroke-width="2"/>
<rect x="334" y="169" width="26" height="26" rx="7" fill="#ffffff"/>
