<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627" role="img" aria-label="Same data. Everywhere. Always current. A core on-premises SQL Server is kept continuously in sync with a copy in Amazon RDS through a live stream on Confluent Cloud, serving analytics, cloud migration and disaster recovery.">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 z" fill="#ffb454"/></marker>
