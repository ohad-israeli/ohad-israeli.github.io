<text x="60" y="108" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="52" font-weight="700" fill="#f3f6fa" letter-spacing="-2">Same data. Everywhere.</text>
<text x="60" y="176" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="52" font-weight="700" fill="#ffb454" letter-spacing="-2"><tspan fill="#ffb454">$ </tspan>Always current.</text>
<text x="60" y="234" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="25" fill="#d6dce6">Keep a core on-prem database and the cloud in sync,</text>
<text x="60" y="266" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="25" fill="#d6dce6">without touching production.</text>
