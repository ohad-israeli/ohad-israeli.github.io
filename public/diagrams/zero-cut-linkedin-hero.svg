<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627" role="img" aria-label="One address, new home. Applications keep connecting to a stable CPC Gateway address while a self-managed Kafka cluster is migrated to a private Confluent Cloud cluster over Private Service Connect: no flag day, private networking, consumer offsets carried over.">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 z" fill="#ffb454"/></marker>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/></pattern></defs>
<rect width="1200" height="627" fill="#0a0c11"/><rect width="1200" height="627" fill="url(#grid)"/>
<text x="60" y="108" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="52" font-weight="700" fill="#f3f6fa" letter-spacing="-2">One address.</text>
<text x="60" y="176" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="52" font-weight="700" fill="#ffb454" letter-spacing="-2"><tspan fill="#ffb454">$ </tspan>New home.</text>
<text x="60" y="234" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="25" fill="#d6dce6">Move Kafka to a private Confluent Cloud cluster</text>
<text x="60" y="266" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="25" fill="#d6dce6">without asking every team to restart.</text>
<rect x="800" y="62" width="340" height="170" rx="6" fill="#11141b" stroke="#313a4b" stroke-width="1.5"/>
<circle cx="826" cy="110" r="6" fill="#4a5262"/>
<text x="846" y="115" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#6b7385" text-decoration="line-through">Flag-day migration</text>
<text x="846" y="140" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="16" fill="#6b7385">every team, one weekend</text>
<line x1="820" y1="160" x2="1120" y2="160" stroke="#222734" stroke-width="2"/>
<circle cx="826" cy="196" r="8" fill="#ffb454"/><circle cx="826" cy="196" r="14" fill="none" stroke="#ffb454" stroke-opacity=".35" stroke-width="3"/>
<text x="846" y="196" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#f3f6fa">Zero-cut migration</text>
<text x="846" y="219" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="16" fill="#ffcb82">same address, new home</text>
<rect x="60" y="318" width="310" height="190" rx="6" fill="#11141b" stroke="#313a4b" stroke-width="1.5"/>
<text x="215" y="460" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="600" fill="#f3f6fa">Your applications</text>
<text x="215" y="488" text-anchor="middle" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="17" fill="#8a93a6">producers and consumers</text>
<g transform="translate(180,350)"><rect x="0" y="0" width="70" height="20" rx="4" fill="#ffb454" fill-opacity=".85"/><rect x="0" y="28" width="70" height="20" rx="4" fill="#ffb454" fill-opacity=".6"/><rect x="0" y="56" width="70" height="20" rx="4" fill="#ffb454" fill-opacity=".35"/></g>
<rect x="445" y="318" width="310" height="190" rx="6" fill="#11141b" stroke="#313a4b" stroke-width="1.5"/>
<text x="600" y="460" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="600" fill="#f3f6fa">One stable address</text>
<text x="600" y="488" text-anchor="middle" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="17" fill="#8a93a6">CPC Gateway</text>
<rect x="500" y="350" width="200" height="60" rx="10" fill="#ffffff" stroke="#2b3340"/><image x="515" y="362" width="170" height="36" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/>
<rect x="830" y="318" width="310" height="190" rx="6" fill="#11141b" stroke="#313a4b" stroke-width="1.5"/>
<text x="985" y="460" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="600" fill="#f3f6fa">Confluent Cloud</text>
<text x="985" y="488" text-anchor="middle" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="17" fill="#8a93a6">private, over Private Service Connect</text>
<rect x="935" y="337" width="100" height="88" rx="10" fill="#ffffff" stroke="#2b3340"/><image x="955" y="347" width="60" height="68" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/>
<line x1="380" y1="395" x2="425" y2="395" stroke="#ffb454" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><line x1="765" y1="395" x2="810" y2="395" stroke="#ffb454" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/>
<rect x="60" y="548" width="310" height="46" rx="6" fill="rgba(255,180,84,0.14)" stroke="#ffb454" stroke-opacity=".5" stroke-width="1.2"/><text x="215" y="577" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#ffcb82">No flag day</text><rect x="445" y="548" width="310" height="46" rx="6" fill="rgba(255,180,84,0.14)" stroke="#ffb454" stroke-opacity=".5" stroke-width="1.2"/><text x="600" y="577" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#ffcb82">Private networking</text><rect x="830" y="548" width="310" height="46" rx="6" fill="rgba(255,180,84,0.14)" stroke="#ffb454" stroke-opacity=".5" stroke-width="1.2"/><text x="985" y="577" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#ffcb82">Offsets carried over</text>
</svg>