<rect x="40" y="500" width="1140" height="72" rx="10" fill="#161b22" stroke="#57606a" stroke-width="1.4"/>
<text x="60" y="524" font-size="10.5" fill="#e6edf3" font-weight="600">No Spark or Airflow job reads this topic and writes Parquet anywhere.</text>
<text x="60" y="542" font-size="10" fill="#9da7b3">Tableflow keeps the Iceberg table's data and metadata in sync with the topic directly. Any Iceberg-aware engine reads it the</text>
<text x="60" y="558" font-size="10" fill="#9da7b3">moment it can reach the REST catalog endpoint -- no pipeline code, no schedule.</text>
