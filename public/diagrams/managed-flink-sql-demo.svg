<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="620" viewBox="0 0 1220 620" font-family="ui-monospace,Menlo,monospace"><rect width="1220" height="620" fill="#0d1117"/><defs>
<marker id="arrowg" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
<marker id="arrowb" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#388bfd"/></marker>
</defs>
<text x="610" y="32" font-size="19" fill="#e6edf3" text-anchor="middle" font-weight="600">Enterprise Flink SQL, Managed Through CMF</text>
<text x="610" y="54" font-size="12.5" fill="#9da7b3" text-anchor="middle">One minikube instance on an existing box &#8212; no new cloud infrastructure</text>

<rect x="30" y="90" width="1160" height="410" rx="16" fill="none" stroke="#57606a" stroke-width="2" stroke-dasharray="7 5"/>
<text x="46" y="114" font-size="12" fill="#9da7b3" text-anchor="start" font-weight="600">minikube (single Kubernetes node, on an existing GCP VM)</text>

<rect x="60" y="140" width="480" height="340" rx="14" fill="#161b22" stroke="#ffb454" stroke-width="2"/>
<text x="76" y="164" font-size="12" fill="#ffb454" text-anchor="start" font-weight="600">namespace: flink-sql-demo</text>

<rect x="80" y="184" width="440" height="60" rx="10" fill="#0d1117" stroke="#57606a" stroke-width="1.4"/>
<text x="300" y="208" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-weight="600">Confluent Manager for Apache Flink</text>
<text x="300" y="225" font-size="9.5" fill="#9da7b3" text-anchor="middle">Environments &#8226; Statements &#8226; Compute Pools</text>

<rect x="80" y="260" width="440" height="50" rx="10" fill="#0d1117" stroke="#57606a" stroke-width="1.4"/>
<text x="300" y="290" font-size="11" fill="#e6edf3" text-anchor="middle" font-weight="600">Flink Kubernetes Operator</text>

<rect x="80" y="326" width="440" height="60" rx="10" fill="#0d1117" stroke="#3fb950" stroke-width="1.6"/>
<text x="300" y="350" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-weight="600">customer-click-enrichment</text>
<text x="300" y="367" font-size="9.5" fill="#9da7b3" text-anchor="middle">running &#8226; no custom JAR, plain Flink SQL</text>

<rect x="80" y="402" width="440" height="40" rx="10" fill="#0d1117" stroke="#57606a" stroke-width="1.4"/>
<text x="300" y="426" font-size="10" fill="#9da7b3" text-anchor="middle">compute pool: sql-demo-pool</text>

<rect x="680" y="140" width="480" height="340" rx="14" fill="#161b22" stroke="#388bfd" stroke-width="2"/>
<text x="696" y="164" font-size="12" fill="#388bfd" text-anchor="start" font-weight="600">namespace: confluent (real Confluent Platform, via CFK)</text>

<rect x="700" y="184" width="440" height="56" rx="10" fill="#0d1117" stroke="#57606a" stroke-width="1.4"/>
<text x="920" y="208" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-weight="600">Kafka (KRaft, single broker)</text>
<text x="920" y="224" font-size="9.5" fill="#9da7b3" text-anchor="middle">clicks &#8226; customers &#8226; customer_click_activity</text>

<rect x="700" y="256" width="440" height="46" rx="10" fill="#0d1117" stroke="#57606a" stroke-width="1.4"/>
<text x="920" y="284" font-size="11" fill="#e6edf3" text-anchor="middle" font-weight="600">Schema Registry</text>

<rect x="700" y="318" width="440" height="60" rx="10" fill="#0d1117" stroke="#57606a" stroke-width="1.4"/>
<text x="920" y="342" font-size="11.5" fill="#e6edf3" text-anchor="middle" font-weight="600">Control Center</text>
<text x="920" y="359" font-size="9.5" fill="#9da7b3" text-anchor="middle">topic browser &#8226; live message viewer</text>

<rect x="700" y="394" width="440" height="40" rx="10" fill="#0d1117" stroke="#57606a" stroke-width="1.4"/>
<text x="920" y="418" font-size="10" fill="#9da7b3" text-anchor="middle">deployed via Confluent for Kubernetes (CFK)</text>

<path d="M540,356 L600,356 L600,205 L700,205" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowg)"/>
<text x="606" y="290" font-size="9.5" fill="#9da7b3" text-anchor="start">reads</text>
<path d="M700,232 L618,232 L618,376 L540,376" fill="none" stroke="#388bfd" stroke-width="2" marker-end="url(#arrowb)"/>
<text x="624" y="326" font-size="9.5" fill="#9da7b3" text-anchor="start">writes</text>

<rect x="60" y="504" width="1100" height="66" rx="10" fill="#161b22" stroke="#57606a" stroke-width="1.4"/>
<text x="80" y="528" font-size="10.5" fill="#e6edf3" font-weight="600">Three UIs, reached from a Mac browser over one SSH tunnel to the VM:</text>
<text x="80" y="546" font-size="10" fill="#9da7b3">CMF (statement lifecycle) &#8226; the native Flink job dashboard (job graph, checkpoints) &#8226; Control Center (Kafka topics, live messages) &#8212; three separate surfaces, not one merged screen.</text>
</svg>
